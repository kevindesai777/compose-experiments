# Workflow for deploying WasmJS App to GitHub Pages
name: Deploy WasmJS App to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger the workflow on pushes to the main branch
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read  # Required to fetch the repository content
  pages: write    # Allow deployment to GitHub Pages
  id-token: write # Required by actions/configure-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: "✅ Checkout code"
        uses: actions/checkout@v4

      # 2. Set up JDK 21
      - name: "⚙️ Set up JDK 21"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Set up Gradle
      # No gradle-version pin: the wrapper is the single source of truth, so AGP's
      # minimum Gradle version can't drift away from CI.
      - name: "⚙️ Setup Gradle"
        uses: gradle/actions/setup-gradle@v3

      # 4. Accept Android SDK licences
      # composeApp is a single module, so even a wasm-only build configures the Android
      # target and needs an SDK. compileSdk 37 is new enough that the runner image may
      # not ship it; accepting licences lets AGP auto-download whatever it needs rather
      # than failing on an unaccepted-licence error.
      - name: "⚙️ Accept Android SDK licences"
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 5. Build the WasmJS App
      - name: "🛠️ Build WasmJS App"
        run: ./gradlew :composeApp:wasmJsBrowserDistribution
        env:
          VERSION: "0.0.0-LOCAL"

      # 6. Set up GitHub Pages
      - name: "📄 Configure GitHub Pages"
        uses: actions/configure-pages@v5

      # 7. Upload the built artifact to Pages
      - name: "📤 Upload GitHub Pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./composeApp/build/dist/wasmJs/productionExecutable

      # 8. Deploy to GitHub Pages
      - name: "🚀 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
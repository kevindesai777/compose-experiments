#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Since AGP 9.0 the 'com.android.application' plugin refuses to sit in the same module
# as 'org.jetbrains.kotlin.multiplatform'. These two flags are AGP's own documented
# bypass and keep the single-module composeApp layout working. The long-term fix is to
# split composeApp into a 'com.android.kotlin.multiplatform.library' module plus a thin
# Android app module: https://developer.android.com/kotlin/multiplatform/plugin
android.builtInKotlin=false
android.newDsl=false